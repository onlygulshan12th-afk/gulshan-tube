<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GULSHAN TUBE — Watch Videos</title><meta name="description" content="GULSHAN TUBE — fast video discovery and watching."><meta name="theme-color" content="#07070a"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#07070a;--card:#111116;--text:#f6f7fb;--muted:#a1a1ad;--line:#26262f;--a:#ff3158;--b:#ff6a3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.nav{position:sticky;top:0;z-index:10;background:rgba(7,7,10,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.navin{max-width:1280px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:18px}.brand{font-size:20px;font-weight:800;white-space:nowrap}.brand span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.search{flex:1;max-width:720px;margin:auto;display:flex;background:#121219;border:1px solid #30303a;border-radius:15px;overflow:hidden}.search:focus-within{border-color:#ff4568;box-shadow:0 0 0 3px #ff31581f}.search input{width:100%;padding:13px 15px;border:0;outline:0;background:transparent;color:#fff}.search button{width:54px;border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:22px}.wrap{max-width:1280px;margin:auto;padding:28px 18px 60px}.hero{padding:12px 0 20px}.hero h1{font-size:clamp(32px,5vw,56px);letter-spacing:-2px;margin:0 0 9px}.hero p{color:var(--muted);margin:0}.chips{display:flex;gap:9px;overflow:auto;padding:6px 0 20px}.chip{background:#101016;color:#ddd;border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap}.status{color:var(--muted);margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.video{background:var(--card);border:1px solid transparent;border-radius:16px;overflow:hidden;cursor:pointer}.video:hover{border-color:#34343f}.thumb{aspect-ratio:16/9;background:#181820;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.duration{position:absolute;right:8px;bottom:8px;background:#000d;padding:4px 7px;border-radius:5px;font-size:12px}.info{padding:11px 12px 14px}.title{font-weight:650;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{color:var(--muted);font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{border:1px dashed #30303a;border-radius:18px;padding:42px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;z-index:30;background:#000d;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.player{width:min(1050px,100%);background:#0d0d12;border:1px solid #2b2b34;border-radius:18px;overflow:hidden}.player iframe{width:100%;aspect-ratio:16/9;border:0;display:block}.pinfo{padding:15px 18px 20px}.pinfo h2{font-size:20px;margin:0 0 7px}.pinfo p{color:var(--muted);margin:0}.close{position:fixed;right:16px;top:14px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#000;font-size:24px}.foot{text-align:center;color:#666;padding:18px;font-size:12px}@media(max-width:700px){.navin{flex-wrap:wrap;gap:10px}.brand{font-size:17px}.search{order:2;flex-basis:100%}.wrap{padding-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:9px}.title{font-size:13px}.meta{font-size:10px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="nav"><div class="navin"><div class="brand">▶ <span>GULSHAN TUBE</span></div><form class="search" id="search"><input id="q" placeholder="Search videos…" autocomplete="off"><button>⌕</button></form></div></header><main class="wrap"><section class="hero"><h1>Watch what you love.</h1><p>Fast video discovery with a clean, mobile-friendly watching experience.</p></section><div class="chips" id="chips"></div><div class="status" id="status">Choose a topic or search for a video.</div><section class="grid" id="grid"><div class="empty">Search for anything to load videos.</div></section></main><div class="modal" id="modal"><button class="close" id="close">×</button><div class="player"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe><div class="pinfo"><h2 id="ptitle"></h2><p id="pmeta"></p></div></div></div><div class="foot">© <span id="year"></span> GULSHAN TUBE</div><script>
const topics=['Music','Gaming','News','Movies','Sports','Technology','Study','Lo-fi','Comedy','Live'];const chips=document.querySelector('#chips');topics.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>search(t);chips.appendChild(b)});const grid=document.querySelector('#grid'),status=document.querySelector('#status'),form=document.querySelector('#search'),q=document.querySelector('#q');form.onsubmit=e=>{e.preventDefault();if(q.value.trim())search(q.value.trim())};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function search(term){status.textContent='Searching…';grid.innerHTML='';q.value=term;try{const r=await fetch('/api/search?q='+encodeURIComponent(term));const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=d.items.length?`${d.items.length} results for “${term}”`:'No results found.';if(!d.items.length){grid.innerHTML='<div class="empty">Try another search.</div>';return}d.items.forEach(v=>{const el=document.createElement('article');el.className='video';el.innerHTML=`<div class="thumb"><img loading="lazy" src="${esc(v.thumbnail)}"><span class="duration">${esc(v.duration)}</span></div><div class="info"><div class="title">${esc(v.title)}</div><div class="meta">${esc(v.channel)}${v.views?' · '+esc(v.views):''}${v.published?' · '+esc(v.published):''}</div></div>`;el.onclick=()=>openVideo(v);grid.appendChild(el)})}catch(e){status.textContent='Could not load videos.';grid.innerHTML='<div class="empty">Search is temporarily unavailable. Please try again.</div>'}}function openVideo(v){document.querySelector('#ptitle').textContent=v.title;document.querySelector('#pmeta').textContent=[v.channel,v.views,v.published].filter(Boolean).join(' · ');document.querySelector('#frame').src='https://www.youtube.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1&rel=0';document.querySelector('#modal').classList.add('open')}function closeVideo(){document.querySelector('#modal').classList.remove('open');document.querySelector('#frame').src=''}document.querySelector('#close').onclick=closeVideo;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeVideo()};document.querySelector('#year').textContent=new Date().getFullYear();
</script></body></html>
