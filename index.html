<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GULSHAN TUBE — Watch Videos</title>
<meta name="description" content="GULSHAN TUBE — discover and watch videos in a fast, modern player.">
<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--surface:#181818;--surface2:#272727;--text:#f1f1f1;--muted:#aaa;--line:#303030;--accent:#ff0033;--accent2:#ff3158}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}
.nav{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.96);border-bottom:1px solid #202020}.navin{height:64px;max-width:1500px;margin:auto;padding:0 20px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.6px;white-space:nowrap}.brandmark{width:34px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px}.brand span{color:#fff}.search{height:42px;flex:1;max-width:720px;margin:auto;display:flex;border:1px solid #444;border-radius:22px;overflow:hidden;background:#121212}.search:focus-within{border-color:#777}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:0 18px;font-size:16px}.search button{width:62px;border:0;border-left:1px solid #333;background:#222;color:#fff;font-size:19px}.nav-actions{display:flex;gap:4px}.iconbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:20px}.iconbtn:hover{background:#272727}
.layout{max-width:1500px;margin:auto}.main{padding:20px 22px 60px}.hero{padding:8px 0 18px}.hero h1{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:-1.8px}.hero p{margin:8px 0 0;color:var(--muted);font-size:15px}.chips{display:flex;gap:10px;overflow:auto;padding:4px 0 18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:0;background:#272727;color:#eee;padding:9px 15px;border-radius:9px;white-space:nowrap}.chip.active{background:#f1f1f1;color:#111}.status{height:24px;color:var(--muted);font-size:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}.video{min-width:0;cursor:pointer}.thumb{position:relative;aspect-ratio:16/9;background:#202020;border-radius:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .18s ease}.video:hover .thumb img{transform:scale(1.02)}.duration{position:absolute;right:7px;bottom:7px;background:#000d;color:#fff;border-radius:4px;padding:3px 5px;font-size:12px}.info{display:grid;grid-template-columns:38px 1fr;gap:10px;padding-top:10px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff0033,#7928ca);display:grid;place-items:center;font-weight:700}.title{font-weight:650;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{grid-column:1/-1;padding:70px 20px;border:1px dashed #343434;border-radius:16px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.92);overflow:auto}.modal.open{display:block}.watch{width:min(1180px,100%);margin:0 auto;padding:20px}.playerbox{background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 70px #000}.video-stage{position:relative;background:#000;aspect-ratio:16/9}.video-stage video{width:100%;height:100%;display:block;background:#000;object-fit:contain}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#000a;color:#fff;font-size:14px}.loading.hide{display:none}.controls{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.92));opacity:0;transition:opacity .18s}.video-stage:hover .controls,.video-stage.paused .controls,.controls:focus-within{opacity:1}.progress{width:100%;accent-color:var(--accent);height:4px;margin:0 0 8px;display:block}.controlrow{display:flex;align-items:center;gap:8px}.ctrl{border:0;background:transparent;color:#fff;width:34px;height:34px;border-radius:6px;font-size:18px}.ctrl:hover{background:#ffffff20}.time{font-size:12px;color:#fff;min-width:90px}.spacer{flex:1}.select{background:#181818;color:#fff;border:1px solid #444;border-radius:6px;padding:5px 7px;font-size:12px}.close{position:fixed;right:18px;top:14px;z-index:110;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#000;font-size:25px}.watchinfo{padding:18px 2px 35px}.watchinfo h2{margin:0 0 8px;font-size:23px;line-height:1.3}.watchmeta{color:var(--muted);font-size:13px}.watch-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{border:0;background:#272727;color:#fff;border-radius:20px;padding:9px 14px}.errorbox{padding:18px;color:#ff9da9;text-align:center;display:none}.errorbox.show{display:block}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.navin{height:auto;min-height:58px;padding:8px 12px;flex-wrap:wrap;gap:8px}.brand{font-size:18px}.nav-actions{margin-left:auto}.search{order:3;flex-basis:100%;max-width:none;margin:0 0 2px}.main{padding:18px 12px 45px}.hero{padding-top:5px}.hero h1{font-size:30px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}.thumb{border-radius:8px}.info{display:block;padding-top:7px}.avatar{display:none}.title{font-size:13px}.meta{font-size:10px}.watch{padding:0}.playerbox{border-radius:0}.video-stage{aspect-ratio:16/9}.watchinfo{padding:15px 12px 35px}.watchinfo h2{font-size:18px}.close{top:8px;right:8px}.controls{opacity:1}.time{min-width:78px;font-size:11px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.thumb{border-radius:10px}.title{font-size:14px}}
</style>
</head>
<body>
<header class="nav"><div class="navin">
  <div class="brand"><div class="brandmark">▶</div><span>GULSHAN TUBE</span></div>
  <form class="search" id="search"><input id="q" placeholder="Search videos" autocomplete="off"><button aria-label="Search">⌕</button></form>
  <div class="nav-actions"><button class="iconbtn" id="homeBtn" title="Home">⌂</button></div>
</div></header>
<main class="layout"><section class="main">
  <section class="hero"><h1>Discover videos.</h1><p>Fast search, a clean feed and a GULSHAN TUBE player — all in one place.</p></section>
  <div class="chips" id="chips"></div><div class="status" id="status">Loading recommendations…</div><section class="grid" id="grid"><div class="empty">Loading videos…</div></section>
</section></main>
<div class="modal" id="modal" aria-hidden="true"><button class="close" id="close">×</button><div class="watch">
  <div class="playerbox"><div class="video-stage" id="stage"><video id="video" playsinline preload="metadata"></video><div class="loading" id="loading">Loading player…</div>
    <div class="controls"><input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1">
      <div class="controlrow"><button class="ctrl" id="play">▶</button><button class="ctrl" id="mute">🔊</button><span class="time" id="time">0:00 / 0:00</span><span class="spacer"></span><select class="select" id="quality"><option value="">Auto</option></select><select class="select" id="speed"><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button class="ctrl" id="fullscreen">⛶</button></div>
    </div>
  </div><div class="errorbox" id="errorbox"></div></div>
  <div class="watchinfo"><h2 id="ptitle"></h2><div class="watchmeta" id="pmeta"></div><div class="watch-actions"><button class="pill" id="share">↗ Share</button><button class="pill" id="openOriginal">Open source</button></div></div>
</div></div>
<script>
const topics=['All','Music','Gaming','News','Movies','Sports','Technology','Study','Comedy','Live'];
const chips=document.querySelector('#chips'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),form=document.querySelector('#search'),q=document.querySelector('#q');
const modal=document.querySelector('#modal'),video=document.querySelector('#video'),stage=document.querySelector('#stage'),loading=document.querySelector('#loading'),errorbox=document.querySelector('#errorbox'),quality=document.querySelector('#quality');
let current=null, formats=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){n=Math.max(0,Math.floor(Number(n)||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function setStatus(t){status.textContent=t}
function buildChips(){topics.forEach((t,i)=>{const b=document.createElement('button');b.className='chip'+(i===0?' active':'');b.textContent=t;b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');search(t==='All'?'trending india':t)};chips.appendChild(b)})}
async function search(term){term=term.trim();if(!term)return;setStatus(`Searching for “${term}”…`);grid.innerHTML='<div class="empty">Searching…</div>';q.value=term;try{const r=await fetch('/api/search?q='+encodeURIComponent(term));const d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');render(d.items||[]);setStatus(d.items?.length?`${d.items.length} results for “${term}”`:'No results found.')}catch(e){setStatus('Search unavailable');grid.innerHTML='<div class="empty">Could not load videos right now. Try again.</div>'}}
function render(items){if(!items.length){grid.innerHTML='<div class="empty">No videos found.</div>';return}grid.innerHTML='';items.forEach(v=>{const el=document.createElement('article');el.className='video';el.innerHTML=`<div class="thumb"><img loading="lazy" src="${esc(v.thumbnail)}" alt=""><span class="duration">${esc(v.duration||'')}</span></div><div class="info"><div class="avatar">${esc((v.channel||'G')[0].toUpperCase())}</div><div><div class="title">${esc(v.title)}</div><div class="meta">${esc(v.channel||'')} ${v.views?' · '+esc(v.views):''}${v.published?' · '+esc(v.published):''}</div></div></div>`;el.onclick=()=>openVideo(v);grid.appendChild(el)})}
async function openVideo(v){current=v;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';loading.classList.remove('hide');errorbox.classList.remove('show');errorbox.textContent='';document.querySelector('#ptitle').textContent=v.title;document.querySelector('#pmeta').textContent=[v.channel,v.views,v.published].filter(Boolean).join(' · ');quality.innerHTML='<option value="">Auto</option>';formats=[];video.pause();video.removeAttribute('src');video.load();try{const r=await fetch('/api/player?videoId='+encodeURIComponent(v.id));const d=await r.json();if(!r.ok)throw Error(d.error||'Player unavailable');formats=d.formats||[];if(!formats.length)throw Error('No direct browser-playable stream is available for this video.');formats.forEach((f,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=f.quality||(`${f.height}p`);quality.appendChild(o)});const best=formats[0];video.src=best.url;video.load();await video.play().catch(()=>{});loading.classList.add('hide');stage.classList.remove('paused')}catch(e){loading.classList.add('hide');errorbox.textContent='GULSHAN TUBE could not load this video in the custom player. You can try another video.';errorbox.classList.add('show')}}
function closeVideo(){video.pause();video.removeAttribute('src');video.load();modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';current=null}
form.onsubmit=e=>{e.preventDefault();search(q.value)};document.querySelector('#close').onclick=closeVideo;modal.onclick=e=>{if(e.target===modal)closeVideo()};document.querySelector('#homeBtn').onclick=()=>search('trending india');
document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();document.querySelector('#mute').onclick=()=>{video.muted=!video.muted;document.querySelector('#mute').textContent=video.muted?'🔇':'🔊'};document.querySelector('#progress').oninput=e=>{if(video.duration)video.currentTime=video.duration*(e.target.value/100)};video.ontimeupdate=()=>{const p=video.duration?video.currentTime/video.duration*100:0;document.querySelector('#progress').value=p;document.querySelector('#time').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`};video.onplay=()=>{document.querySelector('#play').textContent='❚❚';stage.classList.remove('paused')};video.onpause=()=>{document.querySelector('#play').textContent='▶';stage.classList.add('paused')};video.onloadedmetadata=()=>loading.classList.add('hide');
quality.onchange=async()=>{const f=formats[Number(quality.value)];if(!f)return;const t=video.currentTime,was=!video.paused;video.src=f.url;video.load();video.onloadedmetadata=async()=>{try{video.currentTime=t}catch(_){}if(was)await video.play().catch(()=>{});loading.classList.add('hide')}};document.querySelector('#speed').onchange=e=>video.playbackRate=Number(e.target.value);document.querySelector('#fullscreen').onclick=()=>{(stage.requestFullscreen||stage.webkitRequestFullscreen)?.call(stage)};
document.querySelector('#share').onclick=async()=>{const u=location.origin+'/?v='+encodeURIComponent(current?.id||'');try{await navigator.share({title:current?.title||'GULSHAN TUBE',url:u})}catch(_){await navigator.clipboard?.writeText(u);alert('Link copied')}};document.querySelector('#openOriginal').onclick=()=>{if(current)window.open('https://www.youtube.com/watch?v='+encodeURIComponent(current.id),'_blank','noopener')};
buildChips();search('trending india');
</script>
</body></html>
